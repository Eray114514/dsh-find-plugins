name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The peer dependencies are devDependencies too, so a plain install is
      # enough to run the suite. No runtime dependencies to worry about.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
