name: publish

# Publishing is tag-driven: bump the version, push a `v*` tag, and this publishes.
# Nothing manual after that — no OTP, no token, no `npm publish` on a laptop.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Required for OIDC. This is what lets npm verify the workflow's identity
  # instead of trusting a long-lived token.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Published artifacts must pass on the LOWEST supported Node, not just the
      # one that happens to ship the npm CLI this workflow needs (OIDC trusted
      # publishing wants npm >= 11.5, i.e. Node 24). v0.2.4 shipped on a run
      # where the Node 22 leg of `test.yml` failed, which is precisely the gap
      # this step closes.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Test on the lowest supported Node
        run: npm test

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache in a release build (`cache` is the supported input name).
          cache: ''

      # Never publish something that does not pass its own tests.
      - name: Test
        run: npm test

      # No --provenance flag: publishing through a trusted publisher from a
      # public repo produces the provenance attestation automatically.
      - name: Publish
        run: npm publish
